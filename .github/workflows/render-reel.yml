name: Render reel (json2video)

# Renderiza un video con la API de json2video.com desde los runners de GitHub
# (que sí tienen salida a internet). Se dispara a mano o por API.
# Requiere el secreto de repositorio: JSON2VIDEO_API_KEY

on:
  workflow_dispatch:
    inputs:
      json_file:
        description: "Archivo JSON del guion (en la raíz del repo)"
        default: "json2video-reel.json"
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar guion y arrancar el render
        id: start
        run: |
          set -euo pipefail
          FILE="${{ github.event.inputs.json_file }}"
          if [ ! -f "$FILE" ]; then echo "No existe $FILE"; exit 1; fi
          jq empty "$FILE"  # falla si el JSON no es válido
          RESP=$(curl -sS -X POST https://api.json2video.com/v2/movies \
            -H "x-api-key: ${{ secrets.JSON2VIDEO_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @"$FILE")
          echo "Respuesta POST: $RESP"
          PROJECT=$(echo "$RESP" | jq -r '.project // empty')
          if [ -z "$PROJECT" ]; then echo "No se obtuvo project id."; exit 1; fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Esperar a que termine el render
        id: poll
        run: |
          set -euo pipefail
          PROJECT="${{ steps.start.outputs.project }}"
          URL=""
          for i in $(seq 1 90); do
            sleep 10
            RESP=$(curl -sS "https://api.json2video.com/v2/movies?project=$PROJECT" \
              -H "x-api-key: ${{ secrets.JSON2VIDEO_API_KEY }}")
            STATUS=$(echo "$RESP" | jq -r '.movie.status // empty')
            echo "intento $i: status=$STATUS"
            if [ "$STATUS" = "done" ]; then
              URL=$(echo "$RESP" | jq -r '.movie.url')
              break
            fi
            if [ "$STATUS" = "error" ]; then
              echo "El render falló:"; echo "$RESP" | jq .; exit 1
            fi
          done
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then echo "No terminó a tiempo."; exit 1; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "🎬 Video listo: $URL"

      - name: Descargar el video
        run: curl -sSL "${{ steps.poll.outputs.url }}" -o reel-final.mp4

      - name: Guardar el video como artifact
        uses: actions/upload-artifact@v4
        with:
          name: reel-final
          path: reel-final.mp4

      - name: Resumen
        if: always()
        run: |
          URL="${{ steps.poll.outputs.url }}"
          {
            echo "## 🎬 Render de json2video"
            if [ -n "$URL" ]; then
              echo "**Video listo:** $URL"
              echo ""
              echo "También quedó como artifact **reel-final** en esta corrida."
            else
              echo "El render no se completó. Revisá el log de arriba."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
